# Install as /etc/systemd/system/angler-intel.service.d/runtime.conf for V7.6.
# Runtime state stays outside Git under /home/pi/angler-intel/instance.
[Service]
Environment=AI_INSTANCE_DIR=/home/pi/angler-intel/instance
Environment=AI_SQLITE_DB_PATH=/home/pi/angler-intel/instance/angler_intel.sqlite3
Environment=AI_AUTHORITY_MANIFEST=/home/pi/angler-intel/instance/authority.json
Environment=AI_REPORTS_DIR=/home/pi/angler-intel/instance/reports
